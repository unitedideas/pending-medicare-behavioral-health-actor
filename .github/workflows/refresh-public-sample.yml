name: Refresh public pending Medicare sample

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 1,4"

permissions:
  contents: write

concurrency:
  group: refresh-public-pending-medicare-sample
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sample:build
      - name: Commit current sample when evidence changed
        run: |
          if git diff --quiet -- sample; then
            echo "Public sample is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample
          git commit -m "Refresh public pending Medicare sample"
          git push origin HEAD:main
      - name: Publish dated public sample release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_date="$(jq -r '.edition_receipt.sources.physician.current.date' sample/receipt.json)"
          prior_date="$(jq -r '.edition_receipt.sources.physician.previous.date' sample/receipt.json)"
          national_count="$(jq -r '.edition_receipt.selected_behavioral_health_records_national' sample/receipt.json)"
          lookup_count="$(jq -r '.edition_receipt.nppes_lookups_succeeded' sample/receipt.json)"
          tag="sample-${current_date}"
          title="Pending Medicare behavioral-health sample — ${current_date}"
          notes="$(printf 'Free 10-row public sample of behavioral-health NPIs newly present in the %s CMS pending first-time Medicare enrollment files versus %s. The validated national edition selected %s records after %s successful NPPES lookups.\n\nPending means contractor review, not Medicare approval, licensure, credentialing, availability, or buying intent. Inspect receipt.json before relying on a row.\n\nThe complete validated edition is $12 plus buyer-paid Apify usage: https://apify.com/actablesite/pending-medicare-behavioral-health-actor' "$current_date" "$prior_date" "$national_count" "$lookup_count")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes"
            gh release upload "$tag" sample/preview.csv sample/preview.json sample/receipt.json --clobber
          else
            gh release create "$tag" sample/preview.csv sample/preview.json sample/receipt.json --target main --title "$title" --notes "$notes"
          fi
